# Development only (tests, docs). The container needs none of this: python3 -m keeper, standard library only.
[project]
name = "zte-keeper"
version = "2"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=8", "pdoc>=14"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_scenarios.py"]      # the scenario scripts are run by it, each in its own process
